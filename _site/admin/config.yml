backend:
  name: github
  repo: chkuhlmann/chk-site  # Path to your blog repo
  branch: main                               # The branch your site builds from
  base_url: https://decap-proxy.deadrainbow.workers.dev # Your Worker URL
  auth_endpoint: auth                        # Tells Decap to use the worker's auth route

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layout.njk"} # <-- Add this (change layout.njk to whatever your main template is called)
      - {label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "string", default: "General"}
      - {label: "Body", name: "body", widget: "markdown"}