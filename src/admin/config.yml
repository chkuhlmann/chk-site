backend:
  name: github
  repo: chkuhlmann/chk-site
  branch: main
  base_url: https://decap-proxy.deadrainbow.workers.dev
  auth_endpoint: auth
  squash_merges: true

# Keep drafts off main until they are approved and published.
publish_mode: editorial_workflow

site_url: https://calebkuhlmann.studio
display_url: https://calebkuhlmann.studio

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

media_library:
  config:
    max_file_size: 5000000

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Blog Post"
    description: "Posts published in Dead Rainbow."
    folder: "src/blog"
    create: true
    delete: false
    extension: "md"
    format: "frontmatter"

    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}/"

    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields:
      - "date"
      - "title"
      - "category"
      - "commit_date"

    view_groups:
      - label: "Year"
        field: "date"
        pattern: "\\d{4}"
      - label: "Category"
        field: "category"

    editor:
      preview: false

    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The public headline. Do not repeat it as an H1 in the post body."

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - label: "Category"
        name: "category"
        widget: "string"
        default: "General"
        hint: "Use an existing category whenever possible."

      - label: "Description"
        name: "description"
        widget: "text"
        hint: "A one- or two-sentence summary used in blog listings and feeds."
        pattern:
          - "^.{40,240}$"
          - "Write a description between 40 and 240 characters."

      - label: "Tags"
        name: "tags"
        widget: "list"
        default:
          - "website/blog"
        hint: "Primarily used to organize posts in the Obsidian vault."

      - label: "Body"
        name: "body"
        widget: "markdown"
